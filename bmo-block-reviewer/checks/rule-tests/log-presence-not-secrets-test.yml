id: log-presence-not-secrets
valid:
  - "logger.info('auth check', { hasToken: Boolean(accessToken) });"
  - "console.warn('missing key', !!apiKey);"
  - "logger.error('login failed', { userId });"
invalid:
  - "console.log('token', accessToken);"
  - "logger.info({ password });"
  - "logger.debug('cfg', config.apiKey);"
