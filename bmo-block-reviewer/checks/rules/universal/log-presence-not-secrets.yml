id: log-presence-not-secrets
language: TypeScript
severity: error
ignores:
  - '**/*.test.*'
  - '**/*.spec.*'
message: "Do not pass raw secret, token, or password variables to log calls; log `Boolean(secret)` instead."
note: "Wrap credential values in `Boolean(...)` (e.g. `{ hasToken: Boolean(accessToken) }`) so secret values never reach log sinks."
metadata:
  domain: core
  tier: issue
  coverage: partial
  languages: [TypeScript, Tsx, JavaScript]
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: member_expression
        all:
          - has:
              field: object
              regex: ^(console|logger|log)$
          - has:
              field: property
              kind: property_identifier
              regex: ^(log|info|warn|error|debug|trace)$
    - has:
        field: arguments
        has:
          stopBy: end
          any:
            - kind: identifier
              regex: (?i)^(password|passwd|secret|client_?secret|api_?key|access_?token|refresh_?token|id_?token|auth_?token|bearer_?token|private_?key)$
              not:
                inside:
                  stopBy: end
                  any:
                    - pattern: Boolean($$$)
                    - kind: unary_expression
                      has:
                        field: operator
                        regex: ^!$
            - kind: shorthand_property_identifier
              regex: (?i)^(password|passwd|secret|client_?secret|api_?key|access_?token|refresh_?token|id_?token|auth_?token|bearer_?token|private_?key)$
            - kind: property_identifier
              regex: (?i)^(password|passwd|secret|client_?secret|api_?key|access_?token|refresh_?token|id_?token|auth_?token|bearer_?token|private_?key)$
              inside:
                kind: member_expression
                not:
                  inside:
                    stopBy: end
                    any:
                      - pattern: Boolean($$$)
                      - kind: unary_expression
                        has:
                          field: operator
                          regex: ^!$
